name: stylecheck
description: "StyleCheck — get an honest, deterministic score on your outfit."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  cloud_functions: ^5.1.3

  # Subscriptions (RevenueCat SDK + prebuilt Paywall / Customer Center UI)
  purchases_flutter: ^8.1.0
  purchases_ui_flutter: ^8.1.0

  # Media + hashing
  image_picker: ^1.1.2
  crypto: ^3.0.5
  cached_network_image: ^3.4.1

  # Design / motion
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/images/
